# Local PostgreSQL for development: `docker compose up -d`
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gvd
      POSTGRES_PASSWORD: gvd
      POSTGRES_DB: gtavidaily
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
